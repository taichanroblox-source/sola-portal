{% extends 'base.html' %}{% block content %}<div class="pagetitle"><span class="eyebrow">ACCOUNT</span><h1>{{ '新規登録' if mode=='register' else 'ログイン' }}</h1><p>SOLA PORTAL専用のアカウントです。CHATとは別です。</p></div><form class="panel form narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>ユーザー名<input name="username" maxlength="30" required autocomplete="username"></label><label>パスワード<input name="password" type="password" minlength="6" required autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}"></label><button class="primary">{{ '登録する' if mode=='register' else 'ログインする' }}</button><p class="muted">{% if mode=='register' %}<a href="{{ url_for('login') }}">すでにアカウントがある場合</a>{% else %}<a href="{{ url_for('register') }}">アカウントを作成する</a>{% endif %}</p></form>{% endblock %}
