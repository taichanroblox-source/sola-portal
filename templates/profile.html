{% extends 'base.html' %}{% block content %}<div class="pagetitle"><span class="eyebrow">MY SPACE</span><h1>プロフィール</h1><p>このプロフィールは本人にしか公開されません。</p></div><form class="panel form narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="avatarpreview" id="avatarpreview">{% if current_user.avatar %}<img src="{{ current_user.avatar }}" alt="プロフィール画像">{% else %}{{ (current_user.display_name or current_user.username)[0] }}{% endif %}</div><label>画像（2MB以下）<input id="avatarfile" type="file" accept="image/png,image/jpeg,image/webp"></label><input type="hidden" name="avatar" id="avatar" value=""><label>表示名<input name="display_name" maxlength="60" value="{{ current_user.display_name or '' }}"></label><label>自己紹介<textarea name="bio" maxlength="400">{{ current_user.bio or '' }}</textarea></label><button class="primary">保存する</button></form>{% endblock %}
