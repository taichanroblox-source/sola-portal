{% extends 'base.html' %}{% block content %}<div class="pagetitle"><span class="eyebrow">DISCOVER</span><h1>サービス</h1><p>新しいつながりを見つけよう。</p></div><div class="servicegrid">{% for s in services %}<a class="servicecard" href="{{ url_for('go',service_id=s.id) }}"><div class="serviceicon">{{ '◉' if s.icon=='chat' else ('▣' if s.icon=='video' else '✦') }}</div><div class="servicebody"><h3>{{ s.name }}</h3><p>{{ s.description }}</p></div><span class="arrow">↗</span></a>{% else %}<div class="empty">サービスはまだありません。</div>{% endfor %}</div>{% endblock %}
