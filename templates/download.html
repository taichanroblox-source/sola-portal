<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#25182e">
<title>SOLA DOWNLOAD</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -10%,#a44568 0,transparent 43%),radial-gradient(ellipse at 0 85%,#68334e 0,transparent 45%),#24182f}
header{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,5vw,78px);border-bottom:1px solid #ffffff16}
.brand{font-size:18px;font-weight:900;letter-spacing:.045em;color:#ffbe93;text-decoration:none}
header small{color:#bfa9c5}
main{max-width:860px;margin:50px auto;padding:0 20px 48px}
.hero{text-align:center}
.hero h1{font-size:clamp(35px,5vw,52px);letter-spacing:-.035em;line-height:1.25;margin:0 0 10px;background:linear-gradient(90deg,#ffd2a0,#ff8c9e 62%,#dd92e0);background-clip:text;-webkit-background-clip:text;color:transparent}
.hero p{color:#d8c5d8;margin-bottom:28px;line-height:1.8}
.tabs{display:flex;gap:7px;background:#ffffff0d;border:1px solid #ffffff22;border-radius:18px;padding:7px;overflow:auto;scrollbar-width:thin}
.tab{flex:1;white-space:nowrap;background:transparent;color:#e9d7e8;border:0;border-radius:12px;padding:13px 12px;font-size:14px;font-weight:750;cursor:pointer;transition:background .2s,transform .2s}
.tab:hover{background:#ffffff13}
.tab[aria-selected=true]{background:linear-gradient(95deg,#ffb17b,#f577a0);color:#281629;box-shadow:0 3px 15px #10071738}
.panel{margin-top:22px;background:#ffffff10;border:1px solid #ffffff24;box-shadow:0 16px 45px #11091d38;border-radius:24px;padding:clamp(20px,4.5vw,34px);animation:fadein .2s ease}
h2{font-size:24px;margin:0 0 10px}
.description,.note{color:#d1bcd3;font-size:14px;line-height:1.75;margin:0 0 20px}
label{display:block;text-align:left;color:#eadbe9;font-size:14px;margin-bottom:7px;font-weight:650}
input[type=url],select,input[type=file]{display:block;width:100%;border-radius:12px;border:1px solid #ffffff37;background:#291a34;color:white;padding:15px;font:inherit;outline:none}
input:focus,select:focus{border-color:#ffab82;box-shadow:0 0 0 3px #ffae7533}
input::placeholder{color:#a795ab}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.primary,button.secondary,.linkbtn{padding:14px 20px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s,filter .18s}
button.primary{background:linear-gradient(90deg,#ffb379,#f876a2);color:#271829;border:0}
button.secondary,.linkbtn{background:#ffffff14;border:1px solid #ffffff40;color:white}
button:hover:not(:disabled),.linkbtn:hover{transform:translateY(-2px);filter:brightness(1.07)}
button:disabled{opacity:.55;cursor:wait}
.full{width:100%;margin-top:14px}
.output{margin-top:20px;border-top:1px solid #ffffff24;padding-top:22px;animation:fadein .24s ease}
.output img{max-width:220px;width:100%;border-radius:14px;background:#ffffff10;object-fit:contain;max-height:190px}
.output h3{margin:12px 0 5px;overflow-wrap:anywhere}
.output p{color:#d8c2d5}
.status{min-height:22px;color:#cdb9d1;font-size:14px;margin:14px 0 0;overflow-wrap:anywhere}
.status.error{color:#ffb1b4}
.status.success{color:#adf6d2}
progress{width:100%;height:10px;accent-color:#ff987c;margin-top:16px}
.info{border-radius:12px;background:#ffffff0a;border:1px solid #ffffff1f;padding:15px;color:#e1cede;font-size:14px;line-height:1.8;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.conversion-preview{margin-top:16px;max-width:260px;max-height:200px;object-fit:contain;border-radius:12px}
footer{text-align:center;color:#bba4bf;font-size:12px;padding:32px 16px;line-height:1.8}
[hidden]{display:none!important}
@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:630px){header small{display:none}main{margin-top:36px}.tabs{justify-content:flex-start}.tab{flex:0 0 auto;padding:12px}.grid{grid-template-columns:1fr}.actions>*{flex:1}.hero h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><a class="brand" href="/download">☀ SOLA DOWNLOAD</a><small>シンプルで便利なダウンロードツール</small></header>
<main>
<section class="hero"><h1>欲しいファイルを、もっと簡単に。</h1><p>サービスを選んで、ダウンロードやファイル変換をしよう。</p></section>
<nav class="tabs" role="tablist" aria-label="ダウンロードの種類">
<button class="tab" role="tab" aria-selected="true" aria-controls="scratch" data-tab="scratch">Scratch</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="convert" data-tab="convert">ファイル変換</button>
</nav>

<section class="panel" id="scratch" role="tabpanel">
<h2>Scratch作品をダウンロード</h2>
<p class="description">公開されている作品のURLを貼り付けて、作品名・作者を確認してから .sb3 で保存できるよ。</p>
<label for="scratch-url">Scratch作品のURL</label>
<input type="url" id="scratch-url" placeholder="https://scratch.mit.edu/projects/123456789/" autocomplete="url">
<button class="primary full" id="scratch-load">作品を読み込む</button>
<p class="status" id="scratch-message" role="status"></p>
<div class="output" id="scratch-output" hidden>
<img id="scratch-thumb" alt="作品サムネイル">
<h3 id="scratch-title"></h3><p id="scratch-author"></p>
<button class="primary full" id="scratch-download">.sb3 をダウンロード</button>
<progress id="scratch-progress" max="100" hidden></progress>
<p class="status" id="scratch-status" role="status"></p>
<button class="secondary" id="scratch-retry" hidden>再試行</button>
</div>
</section>

<section class="panel" id="convert" role="tabpanel" hidden>
<h2>画像の形式を変換</h2>
<p class="description">自分の画像を選ぶだけ。画像データはサーバーにアップロードされず、端末内で変換するよ。</p>
<label for="convert-file">変換する画像を選択（PNG / JPG / WebP）</label>
<input id="convert-file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="grid">
<div><label for="convert-format">変換先の形式</label><select id="convert-format"><option value="image/png">PNG (.png)</option><option value="image/jpeg">JPEG (.jpg)</option><option value="image/webp">WebP (.webp)</option></select></div>
<div><label for="convert-quality">画質（JPEG / WebP）: <span id="quality-value">90</span>%</label><input id="convert-quality" type="range" min="50" max="100" value="90" style="width:100%;margin-top:13px"></div>
</div>
<img id="convert-preview" class="conversion-preview" alt="選択された画像のプレビュー" hidden>
<button class="primary full" id="convert-run">変換してダウンロード</button>
<p class="status" id="convert-status" role="status"></p>
</section>
</main>
<footer>© SOLA DOWNLOAD — Scratch公式とは関係のない非公式ツールです。</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const setStatus = (id, msg, kind='') => {const e=$(id);e.textContent=msg;e.className='status '+kind};
document.querySelectorAll('[data-tab]').forEach(button=>{
 button.addEventListener('click',()=>{
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));
  document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!==button.dataset.tab);
  history.replaceState(null,'','#'+button.dataset.tab);
 });
});
const initial=location.hash.slice(1);
if(['scratch','convert'].includes(initial))document.querySelector('[data-tab="'+initial+'"]').click();

let scratch=null;
async function loadScratch(){
 $('scratch-output').hidden=true;$('scratch-load').disabled=true;setStatus('scratch-message','作品情報を読み込み中…');
 try{
  const r=await fetch('/download/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('scratch-url').value})});
  const d=await r.json();if(!r.ok)throw Error(d.error||'作品情報を取得できなかったよ。');
  scratch=d;$('scratch-title').textContent=d.title;$('scratch-author').textContent='作者：'+d.author;
  $('scratch-thumb').src=d.thumbnail||'';$('scratch-thumb').hidden=!d.thumbnail;
  $('scratch-output').hidden=false;$('scratch-progress').hidden=true;$('scratch-retry').hidden=true;
  setStatus('scratch-message','');setStatus('scratch-status','');
 }catch(e){setStatus('scratch-message',e.message,'error')}
 finally{$('scratch-load').disabled=false}
}
async function downloadScratch(){
 if(!scratch)return;
 const bar=$('scratch-progress');$('scratch-download').disabled=true;$('scratch-retry').hidden=true;bar.hidden=false;bar.removeAttribute('value');
 setStatus('scratch-status','作品ファイルを準備中…');
 try{
  const r=await fetch('/download/api/download/'+scratch.id);
  if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'ダウンロードに失敗したよ。')}
  const total=Number(r.headers.get('content-length'))||0,reader=r.body.getReader();let chunks=[],received=0;
  while(true){
   const {done,value}=await reader.read();if(done)break;
   chunks.push(value);received+=value.byteLength;
   if(total){bar.value=Math.min(100,Math.floor(received/total*100));setStatus('scratch-status','ダウンロード中 '+bar.value+'%')}
   else setStatus('scratch-status','受信中 '+(received/1048576).toFixed(1)+' MB');
  }
  const safeName=(scratch.title.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/[. ]+$/,'').slice(0,100)||'Scratch-'+scratch.id)+'.sb3';
  saveBlob(new Blob(chunks,{type:'application/octet-stream'}),safeName);
  bar.value=100;setStatus('scratch-status','ダウンロード完了！','success');
 }catch(e){setStatus('scratch-status',e.message,'error');$('scratch-retry').hidden=false}
 finally{$('scratch-download').disabled=false}
}
function saveBlob(blob,name){
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
$('scratch-load').onclick=loadScratch;$('scratch-download').onclick=downloadScratch;$('scratch-retry').onclick=downloadScratch;
$('scratch-url').addEventListener('keydown',e=>{if(e.key==='Enter')loadScratch()});

let selectedImageURL=null;
$('convert-file').addEventListener('change',()=>{
 const file=$('convert-file').files[0];
 if(selectedImageURL)URL.revokeObjectURL(selectedImageURL);
 selectedImageURL=null;$('convert-preview').hidden=true;setStatus('convert-status','');
 if(!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>25*1024*1024){
  setStatus('convert-status','PNG・JPG・WebPで25MB以下の画像を選んでね。','error');return;
 }
 selectedImageURL=URL.createObjectURL(file);$('convert-preview').src=selectedImageURL;$('convert-preview').hidden=false;
});
$('convert-quality').oninput=()=>$('quality-value').textContent=$('convert-quality').value;
$('convert-run').onclick=async()=>{
 const file=$('convert-file').files[0],btn=$('convert-run');
 if(!file||!selectedImageURL){setStatus('convert-status','最初に画像を選んでね。','error');return}
 btn.disabled=true;setStatus('convert-status','画像を変換中…');
 try{
  const img=new Image();img.src=selectedImageURL;await img.decode();
  if(img.naturalWidth*img.naturalHeight>70000000)throw Error('画像サイズが大きすぎるよ。');
  const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('変換に対応していないブラウザだよ。');
  if($('convert-format').value==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height)}
  ctx.drawImage(img,0,0);
  const type=$('convert-format').value;
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('変換できなかったよ。')),type,Number($('convert-quality').value)/100));
  if(blob.type!==type)throw Error('このブラウザは選択した形式に対応していないよ。');
  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[type];
  const basename=file.name.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,100)||'converted';
  saveBlob(blob,basename+'.'+ext);setStatus('convert-status','変換完了！ ファイルを保存したよ。','success');
 }catch(e){setStatus('convert-status',e.message||'変換できなかったよ。','error')}
 finally{btn.disabled=false}
};

/* Keep the shared portal service responsive while this page is open. */
const HEARTBEAT_INTERVAL_MS = 10 * 60 * 1000;
let lastHeartbeat = Date.now();
async function pingServer(){
 lastHeartbeat = Date.now();
 try{
  await fetch('/health?heartbeat='+lastHeartbeat,{
   method:'GET',cache:'no-store',credentials:'same-origin',
   signal:AbortSignal.timeout(12000)
  });
 }catch(e){
  // Network outages or sleeping servers are handled by the next heartbeat.
 }
}
setInterval(pingServer,HEARTBEAT_INTERVAL_MS);
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden && Date.now()-lastHeartbeat>=HEARTBEAT_INTERVAL_MS){
  pingServer();
 }
});
</script>
</body>
</html>
